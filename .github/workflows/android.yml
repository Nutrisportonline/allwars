name: Build APK - Tablas Pro Offline - io.github.negociostj.twa

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          # cache: 'npm'  <- ELIMINADO, era el que causaba el error

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install
        run: npm install

      - name: Add Android
        run: |
          npx cap add android || echo "exists"
          cat capacitor.config.json

      - name: Copy web
        run: npx cap copy android

      - name: Patch Manifest - Add native permissions
        run: |
          FILE=android/app/src/main/AndroidManifest.xml
          python3 << 'PY'
          import pathlib
          p = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          txt = p.read_text()
          if "WRITE_EXTERNAL_STORAGE" not in txt:
              txt = txt.replace("<manifest", '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />', 1)
              txt = txt.replace('xmlns:android="http://schemas.android.com/apk/res/android" xmlns:android=', 'xmlns:android=')
              p.write_text(txt)
          print("Patched")
          PY
          cat $FILE

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: List APKs
        run: find android/app/build/outputs -type f -name "*.apk" | xargs ls -lh

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TablasPro-Offline-io.github.negociostj.twa-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 10
